name: plantvision
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - numpy==2.4.6
      - pandas==3.0.6
      - matplotlib==3.11.2
      - opencv-python==5.0.0
      - scikit-image==0.26.0
      - scipy==1.17.1
      - jupyterlab
      # PyTorch, CPU build (only needed for the deep-learning modules 5 and 6)
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.14.1
      - torchvision==0.29.1
